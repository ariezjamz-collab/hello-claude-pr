name: IOKI FX plugins

on:
  push:
    paths:
      - "imagfx/**"
      - ".github/workflows/imagfx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl-sdk

      - name: Build (Windows, MSVC)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cmake -S imagfx -B build -A x64 -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          cp build/Release/IokiFX.dll build/Release/IokiFlame.dll build/Release/IokiLooks.dll build/Release/IokiKey.dll build/Release/IokiBlob.dll build/Release/IokiFace.dll dist/
          cp imagfx/third_party/facedetection/LICENSE-libfacedetection.txt dist/

      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cmake -S imagfx -B build -G Xcode -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          cp imagfx/third_party/facedetection/LICENSE-libfacedetection.txt dist/
          for PLUGIN in IokiFX IokiFlame IokiLooks IokiKey IokiBlob IokiFace; do
            codesign --force --deep --sign - build/Release/$PLUGIN.bundle
            lipo -info build/Release/$PLUGIN.bundle/Contents/MacOS/$PLUGIN
            cp -R build/Release/$PLUGIN.bundle dist/
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../IokiFX-windows-x64.zip IokiFX.dll IokiFlame.dll IokiLooks.dll IokiKey.dll IokiBlob.dll IokiFace.dll LICENSE-libfacedetection.txt
          else
            zip -r -y ../IokiFX-macos-universal.zip IokiFX.bundle IokiFlame.bundle IokiLooks.bundle IokiKey.bundle IokiBlob.bundle IokiFace.bundle LICENSE-libfacedetection.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: IokiFX-${{ matrix.name }}
          path: IokiFX-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iokifx-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IOKI FX build ${GITHUB_RUN_NUMBER}" \
            --notes "Six Resolume FFGL effects, each with an Effect On toggle: IOKI Face (multi-face tracking with boxes, lines, numbers and landmarks; needs a CPU with AVX2 on Windows), IOKI Blob (blob tracking with squares, lines and numbers), IOKI Key (keys the performer out of the camera), IOKI FX (glitch looks), IOKI Flame (monochrome camera, tracked flame trails, heat haze, dispersion, tracking squares) and IOKI Looks (looks panel with tracking, echoes, ASCII and effect levels). The plugins were renamed from IMAG to IOKI: delete the old Imag* files from Extra Effects first. Windows: copy the six DLLs to Documents/Resolume Arena/Extra Effects. macOS: unzip, copy the six .bundle folders to Documents/Resolume Arena/Extra Effects, then run: xattr -dr com.apple.quarantine IokiFace.bundle IokiBlob.bundle IokiKey.bundle IokiFX.bundle IokiFlame.bundle IokiLooks.bundle. Restart Arena." \
            --prerelease
