name: IMAG FX plugin

on:
  push:
    paths:
      - "imagfx/**"
      - ".github/workflows/imagfx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl-sdk

      - name: Build (Windows, MSVC)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cmake -S imagfx -B build -A x64 -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          cp build/Release/ImagFX.dll build/Release/ImagFlame.dll build/Release/ImagLooks.dll dist/

      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cmake -S imagfx -B build -G Xcode -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          for PLUGIN in ImagFX ImagFlame ImagLooks; do
            codesign --force --deep --sign - build/Release/$PLUGIN.bundle
            lipo -info build/Release/$PLUGIN.bundle/Contents/MacOS/$PLUGIN
            cp -R build/Release/$PLUGIN.bundle dist/
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../ImagFX-windows-x64.zip ImagFX.dll ImagFlame.dll ImagLooks.dll
          else
            zip -r -y ../ImagFX-macos-universal.zip ImagFX.bundle ImagFlame.bundle ImagLooks.bundle
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ImagFX-${{ matrix.name }}
          path: ImagFX-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imagfx-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IMAG FX build ${GITHUB_RUN_NUMBER}" \
            --notes "Three Resolume FFGL effects: IMAG FX (glitch looks), IMAG Flame (monochrome camera, tracked flame trails, heat haze, dispersion, tracking squares) and IMAG Looks (looks panel: night vision, fire map, gold edge, analog TV, glitter, comic, halftone, paper, animated cartoon). Windows: copy the three DLLs to Documents/Resolume Arena/Extra Effects. macOS: unzip, copy the three .bundle folders to Documents/Resolume Arena/Extra Effects, then run: xattr -dr com.apple.quarantine ImagFX.bundle ImagFlame.bundle ImagLooks.bundle. Restart Arena." \
            --prerelease
