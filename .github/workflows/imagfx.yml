name: IMAG FX plugin

on:
  push:
    paths:
      - "imagfx/**"
      - ".github/workflows/imagfx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl-sdk

      - name: Build (Windows, MSVC)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cmake -S imagfx -B build -G "Visual Studio 17 2022" -A x64 -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          cp build/Release/ImagFX.dll dist/

      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cmake -S imagfx -B build -G Xcode -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          codesign --force --deep --sign - build/Release/ImagFX.bundle
          lipo -info build/Release/ImagFX.bundle/Contents/MacOS/ImagFX
          mkdir -p dist
          cp -R build/Release/ImagFX.bundle dist/

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../ImagFX-windows-x64.zip ImagFX.dll
          else
            ditto -c -k --keepParent ImagFX.bundle ../ImagFX-macos-universal.zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ImagFX-${{ matrix.name }}
          path: ImagFX-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imagfx-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IMAG FX build ${GITHUB_RUN_NUMBER}" \
            --notes "Resolume FFGL effect. Windows: copy ImagFX.dll to Documents/Resolume Arena/Extra Effects. macOS: unzip, copy ImagFX.bundle to Documents/Resolume Arena/Extra Effects, then run: xattr -dr com.apple.quarantine ImagFX.bundle. Restart Arena." \
            --prerelease
