name: IMAG FX plugin

on:
  push:
    paths:
      - "imagfx/**"
      - ".github/workflows/imagfx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Resolume FFGL SDK
        uses: actions/checkout@v4
        with:
          repository: resolume/ffgl
          path: ffgl-sdk

      - name: Build (Windows, MSVC)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cmake -S imagfx -B build -A x64 -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          cp build/Release/ImagFX.dll build/Release/ImagFlame.dll build/Release/ImagLooks.dll build/Release/ImagKey.dll build/Release/ImagBlob.dll dist/

      - name: Build (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cmake -S imagfx -B build -G Xcode -DFFGL_SDK_DIR="$GITHUB_WORKSPACE/ffgl-sdk"
          cmake --build build --config Release
          mkdir -p dist
          for PLUGIN in ImagFX ImagFlame ImagLooks ImagKey ImagBlob; do
            codesign --force --deep --sign - build/Release/$PLUGIN.bundle
            lipo -info build/Release/$PLUGIN.bundle/Contents/MacOS/$PLUGIN
            cp -R build/Release/$PLUGIN.bundle dist/
          done

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../ImagFX-windows-x64.zip ImagFX.dll ImagFlame.dll ImagLooks.dll ImagKey.dll ImagBlob.dll
          else
            zip -r -y ../ImagFX-macos-universal.zip ImagFX.bundle ImagFlame.bundle ImagLooks.bundle ImagKey.bundle ImagBlob.bundle
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ImagFX-${{ matrix.name }}
          path: ImagFX-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imagfx-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IMAG FX build ${GITHUB_RUN_NUMBER}" \
            --notes "Five Resolume FFGL effects: IMAG Blob (blob tracking with squares, lines and numbers), IMAG Key (keys the performer out of the camera), IMAG FX (glitch looks), IMAG Flame (monochrome camera, tracked flame trails, heat haze, dispersion, tracking squares) and IMAG Looks (looks panel with tracking, echoes, ASCII and effect levels). Windows: copy the five DLLs to Documents/Resolume Arena/Extra Effects. macOS: unzip, copy the five .bundle folders to Documents/Resolume Arena/Extra Effects, then run: xattr -dr com.apple.quarantine ImagBlob.bundle ImagKey.bundle ImagFX.bundle ImagFlame.bundle ImagLooks.bundle. Restart Arena." \
            --prerelease
